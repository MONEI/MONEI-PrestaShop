name: Tests

on:
  pull_request:
  push:
    branches: [master]

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ⚠️ Pinned to 8.3. The php-cs-fixer version this module depends on refuses
      # to run on anything newer, and forcing it through PHP_CS_FIXER_IGNORE_ENV
      # makes it rewrite code in ways it warns about itself.
      - uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231 # v2.31.1
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@57532f8be5bda426838819c5ee9afb8af389d51a # v3.0.0

      - name: Code style
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.php

      - name: Unit tests
        run: ./vendor/bin/phpunit

  javascript:
    name: JavaScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      # No lockfile is committed (.gitignore covers them all), so this cannot be
      # `npm ci`.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
